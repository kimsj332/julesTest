<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Ranking Data Stream</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <div class="logo">
                <img src="logo.svg" alt="RankTracker Logo">
                <h1>RankTracker</h1>
            </div>
            <button class="add-product-btn">+ Add Product</button>
        </header>

        <!-- Main Content -->
        <main>
            <h2>Product Ranking Data Stream</h2>

            <!-- Filters -->
            <div class="filters">
                <div class="brand-filters">
                    <span>Filter by Brand</span>
                    <button class="active">All Brands</button>
                    <button>Brand A</button>
                    <button>Brand B</button>
                    <button>Brand C</button>
                    <button>Brand D</button>
                    <button>Brand E</button>
                </div>
                <div class="actions">
                    <button class="date-filter">
                        <img src="calendar.svg" alt="Calendar Icon">
                        <span>Last 30 Days</span>
                    </button>
                    <button class="download-btn">
                        <img src="download.svg" alt="Download Icon">
                    </button>
                </div>
            </div>

            <!-- Data Table -->
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>PRODUCT</th>
                            <!-- Dates will be populated by JavaScript -->
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Product rows will be populated by JavaScript -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
