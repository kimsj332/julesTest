<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>네이버 쇼핑 랭킹 모니터</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header>
            <div class="logo">
                <div class="logo-icon">📊</div>
                <h1>네이버 쇼핑 랭킹 모니터</h1>
            </div>

            <div class="device-filter">
                <button class="device-btn active" data-device="Mobile">📱 모바일</button>
                <button class="device-btn" data-device="PC">💻 PC</button>
            </div>

            <div class="time-filter">
                <button class="time-btn" data-time="morning">오전</button>
                <button class="time-btn active" data-time="afternoon">오후</button>
            </div>

            <!-- 가이드 텍스트 영역 -->
            <div id="guide-text" style="margin-left: 20px; font-weight: 600; color: #cbd5e1;"></div>
        </header>

        <main>
            <div class="filters">
                <div class="brand-filters">
                    <span class="filter-label">브랜드 필터</span>
                    <button class="brand-btn active" data-brand="favorite">⭐ 즐겨찾기</button>
                    <button class="brand-btn" data-brand="all">전체</button>
                </div>
                <div class="actions">



                    <div class="date-range">
                        <label>기간</label>
                        <div class="date-inputs">
                            <input type="date" id="startDate" class="date-input">
                            <span class="date-separator">~</span>
                            <input type="date" id="endDate" class="date-input">
                        </div>
                        <div class="quick-buttons">
                            <button class="quick-btn active" data-days="3">최근 3일</button>
                            <button class="quick-btn" data-days="7">최근 7일</button>
                            <button class="quick-btn" data-days="14">최근 14일</button>
                            <button class="quick-btn" data-days="30">최근 30일</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="table-container">
                <table id="rankingTable">
                    <thead>
                        <tr>
                            <th class="sticky-col">제품 정보</th>
                            <th class="sticky-col-2">키워드</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="loading-row">
                            <td colspan="100">
                                <div class="loading-spinner">데이터 로딩 중...</div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>

</html>
